name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-security:
    uses: osloer-industries/.github/.github/workflows/workflow-security.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read

  quality:
    uses: osloer-industries/.github/.github/workflows/node-npm-quality.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      check-npm-script: check

  test-library:
    name: Test library (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - 24
    env:
      NODE_OPTIONS: '--dns-result-order=ipv4first'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and unit tests
        run: npm test

      - name: Repository link check tests (coverage)
        run: npm run test:repo

      - name: Integration test
        # Simple checks for now to guard against errors that stop it running at all, e.g. https://github.com/tcort/markdown-link-check/issues/370
        run: |
          ./markdown-link-check test/alive-links-only.md || (echo "Error: Blew up with basic use" && exit 1)
          ./markdown-link-check test/alive-links-only.md --config test/empty-config.json || (echo "Error: Blew up with config file" && exit 1)

  codeql:
    uses: osloer-industries/.github/.github/workflows/codeql-javascript-typescript.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    permissions:
      contents: read
      actions: read
      security-events: write

  sonar-zero-open-issues:
    if: github.event_name == 'pull_request'
    uses: osloer-industries/.github/.github/workflows/sonarcloud-zero-issues.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      project-key: osloer-industries_markdown-link-check
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  ci-passed:
    name: ci-passed
    needs:
      - workflow-security
      - quality
      - test-library
      - codeql
      - sonar-zero-open-issues
    if: always()
    uses: osloer-industries/.github/.github/workflows/ci-passed.yml@348b254ef112f4f8e239a41e7adb3f3e2dac3944 # v0.1.6
    with:
      needs-json: ${{ toJSON(needs) }}