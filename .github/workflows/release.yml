name: Release

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'
          cache: false
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker-build-and-publish:
    name: "Docker: Build & Publish"
    runs-on: ubuntu-latest
    steps:
      - name: "Config: Registry"
        run: echo "REGISTRY=ghcr.io" >> "$GITHUB_ENV"
      - name: "Config: Image Name"
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: echo "IMAGE_NAME=${REPOSITORY_OWNER}/$(basename "${REPOSITORY}")" >> "$GITHUB_ENV"
      - name: "Config: Image URL"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: echo "IMAGE_URL=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_ENV"
      - name: "Config: Semver Tags"
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          echo "SEMVER_TAGS=$(echo "${RELEASE_REF}" \
          | sed -e 's/refs\/tags\///g' \
          | sed -E 's/v?([0-9]+)\.([0-9]+)\.([0-9]+)(-[a-zA-Z]+(\.[0-9]+)?)?/\1.\2.\3\4\,\1.\2\4\,\1\4/g')" >> "$GITHUB_ENV"
      - name: "Repo: Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Docker: Build & Publish"
        id: build
        uses: elgohr/Publish-Docker-Github-Action@1c2f28ccd9476e8a936ac9a1f287405504c93304 # v5.16.0
        env:
          DOCKER_IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DOCKER_REGISTRY: ${{ env.REGISTRY }}
          DOCKER_REPOSITORY_OWNER: ${{ github.repository_owner }}
          DOCKER_SEMVER_TAGS: ${{ env.SEMVER_TAGS }}
        with:
          name: ${{ env.DOCKER_IMAGE_NAME }}
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ env.DOCKER_REPOSITORY_OWNER }}
          password: ${{ secrets.PUBLISH_TOKEN }}
          tags: latest,stable,${{ env.DOCKER_SEMVER_TAGS }}